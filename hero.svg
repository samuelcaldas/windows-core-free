<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#141E3C" />
      <stop offset="100%" stop-color="#070D1E" />
    </linearGradient>
    <linearGradient id="coreTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0078D4" />
    </linearGradient>
    <linearGradient id="coreLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#004E92" />
    </linearGradient>
    <linearGradient id="coreRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005A9E" />
      <stop offset="100%" stop-color="#0B2545" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0078D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.05" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="94" fill="none" stroke="#00D2FF" stroke-width="2.5" stroke-opacity="0.3" />

  <!-- Background Cyber Grid Pattern -->
  <g stroke="#00D2FF" stroke-width="1" stroke-opacity="0.12">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />
    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Holographic Orbit Ring -->
  <ellipse cx="256" cy="270" rx="190" ry="85" fill="none" stroke="url(#orbitGrad)" stroke-width="2" stroke-dasharray="12 6" transform="rotate(-15 256 270)" />
  <ellipse cx="256" cy="270" rx="210" ry="95" fill="none" stroke="#00F5D4" stroke-width="1" stroke-opacity="0.2" transform="rotate(10 256 270)" />

  <!-- Isometric Server Core Node -->
  <g transform="translate(256, 256)">
    <!-- Shadow Base -->
    <polygon points="0,170 120,105 0,40 -120,105" fill="#030712" opacity="0.6" filter="url(#subtleGlow)" />

    <!-- Core Lower Chassis -->
    <polygon points="0,-130 112,-65 0,0 -112,-65" fill="url(#coreTop)" opacity="0.95" />
    <polygon points="-112,-65 0,0 0,130 -112,65" fill="url(#coreLeft)" opacity="0.9" />
    <polygon points="0,0 112,-65 112,65 0,130" fill="url(#coreRight)" opacity="0.92" />

    <!-- Isometric Circuit Seams & Glow Lines -->
    <line x1="0" y1="0" x2="0" y2="130" stroke="#00F5D4" stroke-width="3" stroke-opacity="0.8" filter="url(#subtleGlow)" />
    <line x1="-112" y1="-65" x2="0" y2="0" stroke="#00F5D4" stroke-width="3" stroke-opacity="0.7" />
    <line x1="0" y1="0" x2="112" y2="-65" stroke="#00F5D4" stroke-width="3" stroke-opacity="0.7" />

    <!-- Horizontal Server Chassis Slots -->
    <line x1="-84" y1="20" x2="0" y2="68" stroke="#00D2FF" stroke-width="2" stroke-opacity="0.45" />
    <line x1="-84" y1="50" x2="0" y2="98" stroke="#00D2FF" stroke-width="2" stroke-opacity="0.45" />
    <line x1="0" y1="68" x2="84" y2="20" stroke="#00D2FF" stroke-width="2" stroke-opacity="0.4" />
    <line x1="0" y1="98" x2="84" y2="50" stroke="#00D2FF" stroke-width="2" stroke-opacity="0.4" />

    <!-- Top Surface Circuit Traces -->
    <circle cx="0" cy="-65" r="14" fill="#0B132B" stroke="#00F5D4" stroke-width="2.5" />
    <circle cx="0" cy="-65" r="6" fill="#00F5D4" filter="url(#subtleGlow)" />
    <line x1="-50" y1="-95" x2="-20" y2="-77" stroke="#00F5D4" stroke-width="2" stroke-opacity="0.7" />
    <line x1="50" y1="-95" x2="20" y2="-77" stroke="#00F5D4" stroke-width="2" stroke-opacity="0.7" />
    <circle cx="-50" cy="-95" r="3.5" fill="#00F5D4" />
    <circle cx="50" cy="-95" r="3.5" fill="#00F5D4" />

    <!-- Stylized Neon "W" Terminal Prompt Core -->
    <path d="M-68,-32 L-36,28 L0,-16 L36,28 L68,-32"
          fill="none"
          stroke="url(#neonCyan)"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#neonGlow)" />
  </g>

  <!-- Telemetry Floating Nodes -->
  <!-- Node 1: Green Active Status -->
  <g transform="translate(400, 100)">
    <circle cx="0" cy="0" r="10" fill="#10B981" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="16" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.45" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 4" />
  </g>

  <!-- Node 2: Cyber Cyan Micro-Chip -->
  <g transform="translate(100, 380)">
    <rect x="-14" y="-14" width="28" height="28" rx="6" fill="#101B38" stroke="#00F5D4" stroke-width="2" stroke-opacity="0.7" filter="url(#subtleGlow)" />
    <circle cx="0" cy="0" r="4" fill="#00F5D4" />
  </g>

  <!-- Node 3: Top Left Satellite Node -->
  <g transform="translate(110, 120)">
    <circle cx="0" cy="0" r="5" fill="#00D2FF" filter="url(#subtleGlow)" />
    <line x1="0" y1="0" x2="28" y2="28" stroke="#00D2FF" stroke-width="1.5" stroke-opacity="0.4" />
  </g>
</svg>
