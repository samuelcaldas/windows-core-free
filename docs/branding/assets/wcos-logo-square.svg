<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#141E38" />
      <stop offset="100%" stop-color="#070D1E" />
    </linearGradient>
    <linearGradient id="coreGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0078D4" />
    </linearGradient>
    <linearGradient id="coreGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#004E92" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="56" fill="url(#bgGrad)" />
  <rect width="396" height="396" x="2" y="2" rx="54" fill="none" stroke="#00D2FF" stroke-width="2" stroke-opacity="0.3" />

  <!-- Hexagon Core / Icon -->
  <g transform="translate(200, 160)">
    <polygon points="0,-72 60,-38 0,-4 -60,-38" fill="url(#coreGrad1)" opacity="0.95" />
    <polygon points="-60,-38 0,-4 0,64 -60,30" fill="url(#coreGrad2)" opacity="0.85" />
    <polygon points="0,-4 60,-38 60,30 0,64" fill="#005A9E" opacity="0.9" />

    <line x1="0" y1="-4" x2="0" y2="64" stroke="#00F5D4" stroke-width="2" stroke-opacity="0.6" />
    <line x1="-60" y1="-38" x2="0" y2="-4" stroke="#00F5D4" stroke-width="2" stroke-opacity="0.4" />
    <line x1="0" y1="-4" x2="60" y2="-38" stroke="#00F5D4" stroke-width="2" stroke-opacity="0.4" />

    <path d="M-38,-17 L-21,17 L0,-8 L21,17 L38,-17" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#glow)" />
  </g>

  <!-- Brand Typography -->
  <text x="200" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">
    Windows <tspan fill="url(#accentGrad)">CoreOS</tspan>
  </text>

  <text x="200" y="328" font-family="'Cascadia Code', 'Consolas', monospace" font-size="14" font-weight="600" fill="#00F5D4" text-anchor="middle" letter-spacing="2">
    WCOS EDITION
  </text>

  <text x="200" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Free Windows Server Core Distribution
  </text>
</svg>
