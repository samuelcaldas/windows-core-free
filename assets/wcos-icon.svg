<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>
    <linearGradient id="coreGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0078D4" />
    </linearGradient>
    <linearGradient id="coreGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#004E92" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00BBF9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)" />
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#00D2FF" stroke-width="2" stroke-opacity="0.35" />

  <!-- Geometric Server Core / Stylized W Isometric Hexagon -->
  <g transform="translate(128, 128)">
    <!-- Top Face -->
    <polygon points="0,-68 56,-36 0,-4 -56,-36" fill="url(#coreGrad1)" opacity="0.95" />
    
    <!-- Left Face -->
    <polygon points="-56,-36 0,-4 0,60 -56,28" fill="url(#coreGrad2)" opacity="0.85" />
    
    <!-- Right Face -->
    <polygon points="0,-4 56,-36 56,28 0,60" fill="#005A9E" opacity="0.9" />

    <!-- Isometric Terminal Grid Lines -->
    <line x1="0" y1="-4" x2="0" y2="60" stroke="#00F5D4" stroke-width="2" stroke-opacity="0.6" />
    <line x1="-56" y1="-36" x2="0" y2="-4" stroke="#00F5D4" stroke-width="2" stroke-opacity="0.4" />
    <line x1="0" y1="-4" x2="56" y2="-36" stroke="#00F5D4" stroke-width="2" stroke-opacity="0.4" />

    <!-- Stylized W / Terminal Prompt Accent -->
    <path d="M-36,-16 L-20,16 L0,-8 L20,16 L36,-16" 
          fill="none" 
          stroke="url(#neonGlow)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#glow)" />
  </g>

  <!-- Status Core Indicator -->
  <circle cx="204" cy="52" r="6" fill="#10B981" filter="url(#glow)" />
  <circle cx="204" cy="52" r="10" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5" />
</svg>
